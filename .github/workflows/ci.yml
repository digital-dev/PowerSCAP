name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The engine and tests target Windows PowerShell 5.1 and .NET Framework, so this runs on Windows with
    # `shell: powershell` (not pwsh). build\Invoke-Tests.ps1 loads the in-box Pester 3.4.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        shell: powershell
        run: |
          $PSVersionTable | Format-Table -AutoSize
          Get-Module Pester -ListAvailable | Select-Object Name, Version, ModuleBase | Format-Table -AutoSize

      - name: Compile the engine and the app
        shell: powershell
        run: |
          $m = Import-Module .\src\PowerSCAP -Force -PassThru -ErrorAction Stop
          & $m { Import-PowerScapGui }
          "Engine $([PowerScap.Engine.EngineInfo]::Version) compiled"

      - name: Run tests
        shell: powershell
        # Admin: needs specific elevated machine state. Slow: whole-drive and Windows Update searches.
        # Online: talks to NIST NCP. Content: needs SCAP content that is not stored in the repository.
        run: |
          powershell -NoProfile -STA -File build\Invoke-Tests.ps1 -ExcludeTag Admin,Slow,Online,Content
          if ($LASTEXITCODE -ne 0) { throw "$LASTEXITCODE test(s) failed" }

  test-pwsh:
    # The same suite under PowerShell 7 (the runner's pwsh, on .NET 8 or later) with the in-box Pester 3.4.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run tests under PowerShell 7
        shell: pwsh
        run: |
          $PSVersionTable | Format-Table -AutoSize
          pwsh -NoProfile -STA -File build\Invoke-Tests.ps1 -Edition Core -ExcludeTag Admin,Slow,Online,Content
          if ($LASTEXITCODE -ne 0) { throw "$LASTEXITCODE test(s) failed" }

  smoke:
    # End to end on Windows Server: detect, download the matching benchmarks from NIST NCP, scan elevated (runners
    # are administrators), and validate every XCCDF, OVAL and ARF file against the official schemas.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        shell: powershell
        run: |
          powershell -NoProfile -File tools\Invoke-SmokeTest.ps1 -OutputPath "$env:RUNNER_TEMP\smoke"
          if ($LASTEXITCODE -ne 0) { throw 'Smoke test failed' }

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
